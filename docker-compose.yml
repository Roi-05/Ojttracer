version: '3.8'
services:
  db:
    image: postgres:15
    container_name: ojttracer-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ojttracer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ojttracer-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  # LibreOffice-backed DOCX -> PDF for journal generation.
  # Mapped to 3001 so it does not collide with the Express API on 3000.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: ojttracer-gotenberg
    restart: always
    ports:
      - "3001:3000"
    command:
      - gotenberg
      - --api-timeout=120s

volumes:
  pgdata:
